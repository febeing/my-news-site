<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球学术动态聚合</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-10">
        <header class="text-center mb-16">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-4 tracking-tight">全球高校与科研资讯聚合</h1>
            <p id="update-time" class="text-slate-500 font-mono text-sm"></p>
        </header>

        <div id="board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-20 text-slate-400">正在拼命加载各路信源...</div>
        </div>
    </div>

    <script>
        fetch('news.json?t=' + new Date().getTime()).then(res => res.json()).then(data => {
            const board = document.getElementById('board');
            board.innerHTML = ''; // 清空加载提示
            
            document.getElementById('update-time').innerText = 'LAST UPDATED: ' + new Date().toLocaleString();

            // 遍历每个信源板块
            for (const [sourceName, articles] of Object.entries(data)) {
                const section = document.createElement('div');
                section.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col";
                
                section.innerHTML = `
                    <div class="bg-slate-900 px-4 py-2 text-white font-bold text-sm tracking-widest uppercase">
                        ${sourceName}
                    </div>
                    <div class="p-4 flex-1 space-y-6">
                        ${articles.map(art => `
                            <div class="group border-b border-slate-100 last:border-0 pb-4 last:pb-0">
                                <span class="text-[10px] font-bold text-blue-500 uppercase">${art.date}</span>
                                <h3 class="text-md font-bold text-slate-800 group-hover:text-blue-600 transition-colors mb-2">
                                    <a href="${art.link}" target="_blank">${art.title}</a>
                                </h3>
                                <p class="text-sm text-slate-600 leading-relaxed">${art.summary}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
                board.appendChild(section);
            }
        });
    </script>
</body>
</html>
